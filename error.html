<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jagoda Balon - 404 Error</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Gravitas+One&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Reset */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Roboto Flex", sans-serif;
        background-color: #0e0e0e; /* Głębokie szare tło */
        color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
      }

      .error-container {
        max-width: 500px;
        background-color: #070707;
        padding: 30px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      }

      h1 {
        font-family: "Gravitas One", sans-serif;
        font-weight: bold;
        font-size: 3rem;
        margin-bottom: 10px;
        color: #ff6b6b; /* Żywy czerwony kolor */
      }

      h2 {
        font-size: 1.5rem;
        margin-bottom: 20px;
        color: #f0f0f0;
      }

      img {
        max-width: 100%;
        height: auto;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
      }

      .back-home {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 1rem;
        font-weight: bold;
        color: #ffffff;
        background-color: #ff6b6b;
        border: none;
        border-radius: 5px;
        text-decoration: none;
        transition: background-color 0.3s ease;
      }

      .back-home:hover {
        background-color: #d9534f; /* Ciemniejszy czerwony po najechaniu */
      }
    </style>
  </head>
  <body>
    <div class="error-container">
      <h1>Error 404!</h1>
      <h2>Page not found. Oops!</h2>
      <img src="assets/images/byebye.gif" alt="Goodbye GIF" />
      <a href="https://lamonjagod.github.io/awd/" class="back-home"
        >Return Home</a
      >
    </div>
  </body>
</html>
