    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Tworzenie niestandardowego kursora
        const customCursor = document.createElement("div");
        customCursor.classList.add("custom-cursor");
        customCursor.textContent = "+"; // Znak kursora
        document.body.appendChild(customCursor);

        // Śledzenie ruchu myszy
        document.addEventListener("mousemove", (e) => {
          customCursor.style.top = `${e.clientY}px`; // Pozycja Y kursora
          customCursor.style.left = `${e.clientX}px`; // Pozycja X kursora
        });

        // Ukrycie kursora na wszystkich elementach interaktywnych
        const interactiveElements = document.querySelectorAll(
          "a, button, input, textarea"
        );
        interactiveElements.forEach((el) => {
          el.style.cursor = "none";
        });
      });
    </script>
